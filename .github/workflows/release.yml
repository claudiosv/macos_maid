name: release

on:
  # Explicit releases only: `just release` / `just tag` pushes a v* tag.
  push:
    tags: [v*]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-bashly

      - name: Build
        run: |
          bashly generate
          chmod +x maid.sh
          sha256sum maid.sh > maid.sh.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" maid.sh maid.sh.sha256 \
            --title "maid $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "$(printf 'Install or update:\n\n```bash\ncurl -fsSL https://github.com/%s/releases/download/%s/maid.sh -o ./maid.sh && chmod +x ./maid.sh\n```\n' "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME")"
